    <style>
      :root {
        --ink-teal: 0, 194, 168;
        --ink-blue: 70, 50, 255;
        --ink-rose: 255, 0, 115;
      }

      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        background: #000;
        color: #ddd;
        font-family: "Satoshi", sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow: hidden;
        height: 100vh;
        height: 100dvh;
        width: 100vw;
      }

      ::selection {
        background: rgba(0, 194, 168, 0.25);
        color: #fff;
      }

      #ink {
        position: fixed;
        inset: 0;
        z-index: 0;
      }

      .content {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        height: 100%;
        max-width: 52ch;
        margin: 0 auto;
        padding: 2rem;
        gap: 2.5rem;
        pointer-events: none;
      }
      .content > * { pointer-events: auto; }

      .name {
        font-family: "Bitcount Prop Single", system-ui;
        font-size: clamp(1.3rem, 2vw + 0.8rem, 1.7rem);
        font-weight: 600;
        color: #b0b0b0;
        cursor: default;
        will-change: transform;
        text-shadow: 0 0 40px rgba(255,255,255,0.04);
      }
      .name:hover { color: #e0e0e0; }

      .bio {
        font-size: clamp(1rem, 1vw + 0.7rem, 1.2rem);
        line-height: 1.55;
        letter-spacing: -0.01em;
        will-change: transform;
      }

      .bio a {
        color: inherit;
        text-decoration: none;
        background-image: linear-gradient(rgba(255,255,255,0.25), rgba(255,255,255,0.25));
        background-size: 100% 1px;
        background-position: 0 100%;
        background-repeat: no-repeat;
        transition: background-size 0.3s ease, color 0.3s ease;
      }
      .bio a:hover {
        color: #fff;
        background-image: linear-gradient(rgba(255,255,255,0.6), rgba(255,255,255,0.6));
      }

      .links {
        list-style: none;
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
      }

      .link-pill {
        text-decoration: none;
        color: #999;
        font-size: clamp(0.82rem, 0.4vw + 0.6rem, 0.95rem);
        padding: 0.6rem 1.2rem;
        border: 1px solid #222;
        border-radius: 100px;
        display: inline-block;
        will-change: transform;
        transition: color 0.3s ease, border-color 0.3s ease, background-color 0.3s ease;
      }
      .link-pill:hover {
        color: #fff;
        border-color: #555;
        background-color: rgba(255,255,255,0.04);
      }
      .link-pill span {
        display: inline-block;
        will-change: transform;
        pointer-events: none;
      }

      @media (max-width: 600px) {
        .content { padding: 1.5rem; gap: 2rem; }
      }
    </style>
  </head>
  <body>
    <canvas id="ink" aria-hidden="true" role="presentation"></canvas>

    <main class="content">
      <h1 class="name">> dev shah</h1>
      <p class="bio">
        freshman<br>
        building cool things like
        <a href="https://www.unlimitedsat.com" target="_blank" rel="noopener noreferrer">unlimitedSAT.com</a>.<br>
        also into video editing &amp; design (a bit too much, maybe.)
      </p>
      <nav>
        <ul class="links">
          <li><a href="mailto:devshah3@illinois.edu" class="link-pill" aria-label="Send me an email"><span>Email</span></a></li>
          <li><a href="https://github.com/coderustypro" target="_blank" rel="noopener noreferrer" class="link-pill" aria-label="View my GitHub profile"><span>GitHub</span></a></li>
          <li><a href="https://www.linkedin.com/in/dev10shah/" target="_blank" rel="noopener noreferrer" class="link-pill" aria-label="Connect with me on LinkedIn"><span>LinkedIn</span></a></li>
          <li><a href="blogs.html" class="link-pill" data-internal aria-label="Read my blog"><span>Blog</span></a></li>
        </ul>
      </nav>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script>
    (function () {
      const COLORS = [
        [0, 194, 168],
        [70, 50, 255],
        [255, 0, 115],
      ];
      const IS_MOBILE = window.innerWidth < 768;
      const PARTICLE_COUNT = IS_MOBILE ? 400 : 1000;
      const MOUSE_RADIUS = IS_MOBILE ? 120 : 180;
      const MOUSE_RADIUS_SQ = MOUSE_RADIUS * MOUSE_RADIUS;
      const CONNECT_DIST = 70;
      const CLEAR_ALPHA = 0.06;

      const canvas = document.getElementById("ink");
      const ctx = canvas.getContext("2d");
      let w, h, animId, fadeIn = 0;

      const mouse = { x: -9999, y: -9999, speed: 0, active: false };
      let prevMx = 0, prevMy = 0;

      const glowOff = document.createElement("canvas");
      glowOff.width = 400;
      glowOff.height = 400;
      const gc = glowOff.getContext("2d");
      const grad = gc.createRadialGradient(200, 200, 0, 200, 200, 200);
      grad.addColorStop(0, "rgba(255,255,255,0.018)");
      grad.addColorStop(1, "rgba(255,255,255,0)");
      gc.fillStyle = grad;
      gc.fillRect(0, 0, 400, 400);

      class Particle {
        constructor() {
          this.depth = Math.random();
          this.homeX = Math.random() * w;
          this.homeY = Math.random() * h;
          this.x = w / 2 + (Math.random() - 0.5) * 60;
          this.y = h / 2 + (Math.random() - 0.5) * 60;
          this.vx = 0;
          this.vy = 0;
          this.size = 0.4 + this.depth * 2;
          this.baseAlpha = 0.03 + this.depth * 0.13;
          this.alpha = this.baseAlpha;
          this.friction = 0.955 - this.depth * 0.02;
          this.returnK = 0.008 + this.depth * 0.008;
          this.sensitivity = 0.2 + this.depth * 0.8;

          if (Math.random() < 0.2) {
            this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
          } else {
            const g = 170 + Math.random() * 85;
            this.color = [g, g, g];
          }
        }

        update() {
          const dx = mouse.x - this.x;
          const dy = mouse.y - this.y;
          const distSq = dx * dx + dy * dy;

          if (distSq < MOUSE_RADIUS_SQ && mouse.active) {
            const dist = Math.sqrt(distSq);
            const force = ((MOUSE_RADIUS - dist) / MOUSE_RADIUS) * this.sensitivity;
            const angle = Math.atan2(dy, dx);
            const speedMul = Math.min(mouse.speed / 15, 2.5);

            if (dist > 25) {
              this.vx += Math.cos(angle) * force * 0.4 * speedMul;
              this.vy += Math.sin(angle) * force * 0.4 * speedMul;
            } else {
              this.vx -= Math.cos(angle) * force * 0.2;
              this.vy -= Math.sin(angle) * force * 0.2;
            }
            this.alpha = this.baseAlpha + force * 0.55;
          } else {
            this.alpha += (this.baseAlpha - this.alpha) * 0.04;
          }

          this.vx += (this.homeX - this.x) * this.returnK;
          this.vy += (this.homeY - this.y) * this.returnK;
          this.vx *= this.friction;
          this.vy *= this.friction;
          this.vx += (Math.random() - 0.5) * 0.06;
          this.vy += (Math.random() - 0.5) * 0.06;

          this.x += this.vx;
          this.y += this.vy;
        }

        draw() {
          const a = this.alpha * fadeIn;
          if (a < 0.005) return;
          const [r, g, b] = this.color;
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, 6.2832);
          ctx.fillStyle = `rgba(${r},${g},${b},${a})`;
          ctx.fill();
        }
      }

      const particles = [];

      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        w = window.innerWidth;
        h = window.innerHeight;
        canvas.width = w * dpr;
        canvas.height = h * dpr;
        canvas.style.width = w + "px";
        canvas.style.height = h + "px";
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function init() {
        resize();
        for (let i = 0; i < PARTICLE_COUNT; i++) particles.push(new Particle());
      }

      function animate() {
        if (fadeIn < 1) fadeIn = Math.min(fadeIn + 0.008, 1);

        ctx.fillStyle = `rgba(0,0,0,${CLEAR_ALPHA})`;
        ctx.fillRect(0, 0, w, h);

        for (let i = 0; i < particles.length; i++) {
          particles[i].update();
          particles[i].draw();
        }

        if (mouse.active) {
          ctx.drawImage(glowOff, mouse.x - 200, mouse.y - 200);
        }

        if (mouse.active && mouse.speed > 2) {
          drawConnections();
        }

        animId = requestAnimationFrame(animate);
      }

      function drawConnections() {
        const near = [];
        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];
          const dx = mouse.x - p.x;
          const dy = mouse.y - p.y;
          if (dx * dx + dy * dy < MOUSE_RADIUS_SQ) near.push(p);
        }

        const connectionFade = Math.min(mouse.speed / 25, 1);
        ctx.lineWidth = 0.5;

        for (let i = 0; i < near.length; i++) {
          for (let j = i + 1; j < near.length; j++) {
            const dx = near[i].x - near[j].x;
            const dy = near[i].y - near[j].y;
            const d = Math.sqrt(dx * dx + dy * dy);
            if (d < CONNECT_DIST) {
              const a = (1 - d / CONNECT_DIST) * 0.055 * connectionFade * fadeIn;
              ctx.beginPath();
              ctx.moveTo(near[i].x, near[i].y);
              ctx.lineTo(near[j].x, near[j].y);
              ctx.strokeStyle = `rgba(255,255,255,${a})`;
              ctx.stroke();
            }
          }
        }
      }

      document.addEventListener("mousemove", function (e) {
        mouse.speed = Math.sqrt((e.clientX - prevMx) ** 2 + (e.clientY - prevMy) ** 2);
        prevMx = e.clientX;
        prevMy = e.clientY;
        mouse.x = e.clientX;
        mouse.y = e.clientY;
        mouse.active = true;
      });
      document.addEventListener("mouseleave", function () { mouse.active = false; });
      document.addEventListener("touchmove", function (e) {
        const t = e.touches[0];
        mouse.speed = Math.sqrt((t.clientX - prevMx) ** 2 + (t.clientY - prevMy) ** 2);
        prevMx = t.clientX;
        prevMy = t.clientY;
        mouse.x = t.clientX;
        mouse.y = t.clientY;
        mouse.active = true;
      }, { passive: true });
      document.addEventListener("touchend", function () { mouse.active = false; });

      window.addEventListener("resize", function () {
        resize();
        particles.forEach(function (p) {
          p.homeX = Math.random() * w;
          p.homeY = Math.random() * h;
        });
      });

      document.addEventListener("visibilitychange", function () {
        if (document.hidden) {
          cancelAnimationFrame(animId);
        } else {
          animId = requestAnimationFrame(animate);
        }
      });

      function entryAnimation() {
        gsap.set([".name", ".bio", ".links li"], { opacity: 0, y: 25 });
        gsap.to(".name", { opacity: 1, y: 0, duration: 0.9, delay: 0.6, ease: "power3.out" });
        gsap.to(".bio", { opacity: 1, y: 0, duration: 0.9, delay: 0.8, ease: "power3.out" });
        gsap.to(".links li", { opacity: 1, y: 0, duration: 0.7, stagger: 0.08, delay: 1.0, ease: "power3.out" });
      }

      function setupMagnetic() {
        document.querySelectorAll(".name, .bio").forEach(function (el) {
          el.addEventListener("mousemove", function (e) {
            const rect = el.getBoundingClientRect();
            const x = e.clientX - rect.left - rect.width / 2;
            const y = e.clientY - rect.top - rect.height / 2;
            gsap.to(el, { x: x * 0.12, y: y * 0.12, duration: 0.8, ease: "power3.out" });
          });
          el.addEventListener("mouseleave", function () {
            gsap.to(el, { x: 0, y: 0, duration: 1, ease: "elastic.out(1, 0.3)" });
          });
        });

        document.querySelectorAll(".link-pill").forEach(function (pill) {
          var text = pill.querySelector("span");
          pill.addEventListener("mousemove", function (e) {
            var rect = pill.getBoundingClientRect();
            var x = e.clientX - rect.left - rect.width / 2;
            var y = e.clientY - rect.top - rect.height / 2;
            gsap.to(pill, { x: x * 0.4, y: y * 0.4, duration: 0.6, ease: "power3.out" });
            gsap.to(text, { x: x * 0.25, y: y * 0.25, duration: 0.8, ease: "power3.out" });
          });
          pill.addEventListener("mouseleave", function () {
            gsap.to([pill, text], { x: 0, y: 0, duration: 0.9, ease: "elastic.out(1, 0.35)" });
          });
        });
      }

      function setupTransitions() {
        document.querySelectorAll("[data-internal]").forEach(function (link) {
          link.addEventListener("click", function (e) {
            e.preventDefault();
            var href = link.getAttribute("href");
            particles.forEach(function (p) {
              p.homeX = mouse.x + (Math.random() - 0.5) * 40;
              p.homeY = mouse.y + (Math.random() - 0.5) * 40;
              p.returnK = 0.06;
            });
            gsap.to([".name", ".bio", ".links"], { opacity: 0, duration: 0.35, ease: "power2.in" });
            setTimeout(function () { window.location.href = href; }, 550);
          });
        });
      }

      init();
      animate();
      entryAnimation();
      setupMagnetic();
      setupTransitions();
    })();
    </script>
  </body>
</html>
