    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        background: #000;
        color: #ddd;
        font-family: "Satoshi", sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        min-height: 100vh;
        overflow-x: hidden;
      }

      ::selection {
        background: rgba(0, 194, 168, 0.25);
        color: #fff;
      }

      #ink {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
      }

      .content {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        min-height: 100vh;
        max-width: 55ch;
        margin: 0 auto;
        padding: 4rem 2rem;
        gap: 3rem;
      }

      .name {
        font-family: "Bitcount Prop Single", system-ui;
        font-size: clamp(1.3rem, 2vw + 0.8rem, 1.7rem);
        font-weight: 600;
        color: #b0b0b0;
        cursor: default;
        will-change: transform;
      }

      .blog-list { list-style: none; display: grid; gap: 1.25rem; }

      .blog-post a {
        display: block;
        text-decoration: none;
        padding: 1.5rem;
        border: 1px solid #1a1a1a;
        border-radius: 8px;
        transition: background-color 0.3s ease, border-color 0.3s ease, transform 0.3s ease;
        will-change: transform;
      }
      .blog-post a:hover {
        background-color: rgba(255,255,255,0.03);
        border-color: #333;
        transform: translateY(-3px);
      }
      .blog-post h2 {
        font-size: clamp(1rem, 0.5vw + 0.8rem, 1.125rem);
        font-weight: 500;
        color: #e0e0e0;
        margin-bottom: 0.35rem;
      }
      .blog-post .post-meta {
        font-size: clamp(0.82rem, 0.2vw + 0.7rem, 0.95rem);
        color: #777;
      }

      .links {
        list-style: none;
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
      }

      .link-pill {
        text-decoration: none;
        color: #999;
        font-size: clamp(0.82rem, 0.4vw + 0.6rem, 0.95rem);
        padding: 0.6rem 1.2rem;
        border: 1px solid #222;
        border-radius: 100px;
        display: inline-block;
        will-change: transform;
        transition: color 0.3s ease, border-color 0.3s ease, background-color 0.3s ease;
      }
      .link-pill:hover {
        color: #fff;
        border-color: #555;
        background-color: rgba(255,255,255,0.04);
      }
      .link-pill span {
        display: inline-block;
        will-change: transform;
        pointer-events: none;
      }

      @media (max-width: 600px) {
        .content { padding: 3rem 1.5rem; gap: 2.5rem; }
      }
    </style>

  <body>
    <canvas id="ink" aria-hidden="true" role="presentation"></canvas>

    <main class="content">
      <header><h1 class="name">> blog</h1></header>

      <section>
        <ul class="blog-list">
          <li class="blog-post">
            <a href="are-llms-hitting-a-wall.html">
              <h2>Waking Up in 2025: Are Large Language Models Hitting a Scaling Wall?</h2>

      </section>

      <footer>

          <li><a href="mailto:devshah3@illinois.edu" class="link-pill" aria-label="Send me an email"><span>Email</span></a></li>
          <li><a href="https://github.com/coderustypro" target="_blank" rel="noopener noreferrer" class="link-pill" aria-label="View my GitHub profile"><span>GitHub</span></a></li>
          <li><a href="https://www.linkedin.com/in/dev10shah/" target="_blank" rel="noopener noreferrer" class="link-pill" aria-label="Connect with me on LinkedIn"><span>LinkedIn</span></a></li>
        </ul>
      </footer>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script>
    (function () {
      const COLORS = [[0, 194, 168], [70, 50, 255], [255, 0, 115]];
      const IS_MOBILE = window.innerWidth < 768;
      const COUNT = IS_MOBILE ? 80 : 150;

      const canvas = document.getElementById("ink");
      const ctx = canvas.getContext("2d");
      let w, h;

      class Particle {
        constructor() {
          this.reset();
          this.depth = Math.random();
          this.size = 0.3 + this.depth * 1.4;
          this.alpha = 0.02 + this.depth * 0.06;
          if (Math.random() < 0.2) {
            this.color = COLORS[Math.floor(Math.random() * 3)];
          } else {
            const g = 160 + Math.random() * 80;
            this.color = [g, g, g];
          }
        }
        reset() {
          this.x = Math.random() * w;
          this.y = Math.random() * h;
          this.vx = (Math.random() - 0.5) * 0.15;
          this.vy = (Math.random() - 0.5) * 0.15;
        }
        update() {
          this.vx += (Math.random() - 0.5) * 0.01;
          this.vy += (Math.random() - 0.5) * 0.01;
          this.vx *= 0.99;
          this.vy *= 0.99;
          this.x += this.vx;
          this.y += this.vy;
          if (this.x < -10 || this.x > w + 10 || this.y < -10 || this.y > h + 10) {
            this.x = Math.random() * w;
            this.y = Math.random() * h;
          }
        }
        draw() {
          const [r, g, b] = this.color;
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, 6.2832);
          ctx.fillStyle = `rgba(${r},${g},${b},${this.alpha})`;
          ctx.fill();
        }
      }

      const particles = [];

      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        w = window.innerWidth;
        h = window.innerHeight;
        canvas.width = w * dpr;
        canvas.height = h * dpr;
        canvas.style.width = w + "px";
        canvas.style.height = h + "px";
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function init() {
        resize();
        for (let i = 0; i < COUNT; i++) particles.push(new Particle());
      }

      function animate() {
        ctx.clearRect(0, 0, w, h);
        for (const p of particles) { p.update(); p.draw(); }
        requestAnimationFrame(animate);
      }

      window.addEventListener("resize", function () {
        resize();
        particles.forEach(function (p) { p.reset(); });
      });

      init();
      animate();

      gsap.set([".name", ".blog-post", ".links li"], { opacity: 0, y: 20 });
      gsap.to([".name", ".blog-post", ".links li"], {
        opacity: 1, y: 0, duration: 0.6, ease: "power3.out", stagger: 0.1, delay: 0.15
      });

      document.querySelectorAll(".link-pill").forEach(function (pill) {
        var text = pill.querySelector("span");
        pill.addEventListener("mousemove", function (e) {
          var rect = pill.getBoundingClientRect();
          var x = e.clientX - rect.left - rect.width / 2;
          var y = e.clientY - rect.top - rect.height / 2;
          gsap.to(pill, { x: x * 0.4, y: y * 0.4, duration: 0.6, ease: "power3.out" });
          gsap.to(text, { x: x * 0.25, y: y * 0.25, duration: 0.8, ease: "power3.out" });
        });
        pill.addEventListener("mouseleave", function () {
          gsap.to([pill, text], { x: 0, y: 0, duration: 0.9, ease: "elastic.out(1, 0.35)" });
        });
      });
    })();
    </script>
  </body>
